            h += '<div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">' + opt.number + '</span><strong>' + esc(opt.name) + '</strong></div>';
            rows.forEach(function (r) {
                h += '<div class="naat-trow"><span class="naat-tlabel">' + esc(r.label) + '</span><span class="naat-tvalue">' + esc(r.values[oi]) + '</span></div>';
            });
            h += '</div>';
        });
        return h + '</div>';
    }

    function renderBlock(b) {
        if (b.kind === 'paragraph') return '<p class="naat-p">' + esc(b.text) + '</p>';
        if (b.kind === 'key') return '<div class="naat-key">' + esc(b.text) + '</div>';
        if (b.kind === 'callout') return '<div class="naat-callout"><p class="naat-callout-title">' + esc(b.title) + '</p><p>' + esc(b.text) + '</p></div>';
        return renderTable(b.table);
    }

    /* ---------- الصفحات ---------- */
    function viewHome() {
        var cards = topics.map(function (t) {
            return '<a href="#' + t.to + '" class="naat-topic' + (t.quiz ? ' naat-topic-quiz' : '') + '">' +
                '<span class="naat-topic-num">' + t.num + '</span>' +
                '<span class="naat-topic-ico" style="background:' + t.tile + '">' + t.icon + '</span>' +
                '<strong class="naat-topic-title">' + t.title + '</strong>' +
                '<span class="naat-topic-desc">' + t.desc + '</span></a>';
        }).join('');
        app.innerHTML =
            '<div class="naat-hero"><span class="naat-hero-badge">درس نحو تفاعلي</span>' +
            '<h1 class="naat-hero-title">درس النعت</h1>' +
            '<p class="naat-hero-sub">النعت والبدل بالعامية، من غير تعقيد</p>' +
            '<p class="naat-hero-meta">٧ أقسام • ٣٠ مثال محلول • كويز ١٨ سؤال بالنقط</p></div>' +
            '<div class="naat-credit"><span class="naat-credit-crown"><svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff" aria-hidden="true"><path d="M3 8.2 7.2 11.6 12 5l4.8 6.6L21 8.2 19.3 18H4.7Z"/></svg></span>' +
            '<p class="naat-credit-txt">هذا المحتوى صنع تحت إشراف أحمد <span class="naat-credit-name">( Jokerich )</span></p></div>' +
            '<p class="naat-homehint">اضغط على أي قسم يفتح، وفي الأمثلة اضغط «أظهر الحل والسبب»، وفي الآخر العب الكويز واجمع نقط. ولو تايه في أي صفحة، زرار 📚 المكتبة ثابت تحت على اليمين، دوّس عليه في أي وقت يطلعلك كل الأقسام.</p>' +
            '<div class="naat-topics">' + cards + '</div>' +
            '<p class="naat-closing">اتبنى على ملخص الدرس المعتمد، وكل الأمثلة المحلولة محفوظة بالكامل. اختياراتك في الكويز على جهازك بس.</p>';
    }

    function viewSection(section) {
        var topic = null;
        topics.forEach(function (t) { if (t.to === '/s/' + section.id) topic = t; });
        app.innerHTML = pageHead('الجزء ' + section.num, section.title, section.subtitle, topic && topic.icon) +
            '<div class="naat-sectionbody">' + section.blocks.map(renderBlock).join('') + '</div>' + backLink();
    }

    function viewTricks() {
        var h = pageHead('الجزء ٤', 'التريكات الامتحانية', '٨ تريكات بتحسم السؤال', '⭐') + '<div class="naat-tricks">';
        DATA.tricks.forEach(function (t) {
            h += '<div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">' + t.n + '</span><strong>' + esc(t.title) + '</strong></div>' +
                '<p class="naat-p">' + esc(t.text) + '</p></div>';
        });
        app.innerHTML = h + '</div>' + backLink();
    }

    var exFilter = 'all';

    function exampleCard(gid, ex) {
        return '<div class="naat-ex"><div class="naat-ex-chips">' +
            '<span class="naat-chip naat-chip-num">المثال ' + ex.n + '</span>' +
            '<span class="naat-chip naat-level-' + levelSlug(ex.level) + '">' + ex.level + '</span>' +
            (ex.book ? '<span class="naat-chip naat-chip-book">من الكتاب ص 120</span>' : '') + '</div>' +
            '<p class="naat-sentence">' + esc(ex.sentence) + '</p>' +
            (ex.task ? '<p class="naat-p">' + esc(ex.task) + '</p>' : '') +
            (ex.options ? '<p class="naat-opts">' + ex.options.map(esc).join('   ') + '</p>' : '') +
            '<button type="button" class="naat-btn naat-btn-cta" data-action="reveal">أظهر الحل والسبب</button>' +
            '<div class="naat-solution"><p>' + esc(ex.solution) + '</p></div></div>';
    }

    function viewExamples() {
        var filters = [{ value: 'all', label: 'الكل' }].concat(DATA.exampleGroups.map(function (g) {
            return { value: g.id, label: g.title.split(':')[0] };
        }));
        var h = pageHead('الجزء ٥', 'الأمثلة المحلولة', '٣٠ مثال من السهل للتحدّي', '📚') + '<div class="naat-filters">';
        filters.forEach(function (f) {
            h += '<button type="button" class="naat-filter' + (exFilter === f.value ? ' naat-filter-on' : '') + '" data-action="filter" data-group="' + f.value + '">' + esc(f.label) + '</button>';
        });
        h += '</div>';
        DATA.exampleGroups.forEach(function (g) {
            if (exFilter !== 'all' && g.id !== exFilter) return;
            h += '<div class="naat-exgroup"><h2 class="naat-exgroup-title">' + esc(g.title) + '</h2>' +
                (g.note ? '<div class="naat-callout"><p class="naat-callout-title">خد بالك</p><p>' + esc(g.note) + '</p></div>' : '') +
                g.items.map(function (ex) { return exampleCard(g.id, ex); }).join('') + '</div>';
        });
        app.innerHTML = h + backLink();
    }

    function viewReview() {
        var h = pageHead('الجزء ٦', 'المراجعة السريعة', 'كل الدرس في ٣٠ ثانية', '⚡') + '<div class="naat-panel naat-review">';
        DATA.reviewPoints.forEach(function (p) {
            h += '<div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">' + esc(p) + '</span></div>';
        });
        app.innerHTML = h + '</div>' +
            '<div class="naat-callout"><p class="naat-callout-title">مصدر الدرس</p><p>' + esc(DATA.closingNote) + '</p></div>' + backLink();
    }

    /* ---------- الكويز ---------- */
    var quiz = { i: 0, picked: null, score: 0, streak: 0, best: 0, right: 0, done: false };

    function quizRestart() { quiz = { i: 0, picked: null, score: 0, streak: 0, best: 0, right: 0, done: false }; viewQuiz(); }

    function quizHead(title, chip, streak, sub, progress) {
        return '<div class="naat-quizhead"><div class="naat-quizhead-top">' +
            '<span class="naat-quizhead-title">' + title + '</span>' +
            '<span class="naat-quizhead-chip">' + chip + '</span>' +
            (streak >= 2 ? '<span class="naat-streak">' + icoFlame + ' ' + streak + '</span>' : '') + '</div>' +
            (sub ? '<div class="naat-quizhead-sub">' + sub + '</div>' : '') +
            '<div class="naat-progress"><div class="naat-progress-fill" style="width:' + progress + '%"></div></div>' +
            '<div class="naat-pips">' + DATA.questions.map(function (_, pi) {
                return '<span class="naat-pip' + (pi < quiz.i ? ' naat-pip-done' : pi === quiz.i ? ' naat-pip-now' : '') + '"></span>';
            }).join('') + '</div></div>';
    }

    function viewQuiz() {
        var total = DATA.questions.length * 10;
        if (quiz.done) {
            var pct = Math.round((quiz.score / total) * 100);
            var stars = quiz.score >= 160 ? '⭐⭐⭐' : quiz.score >= 120 ? '⭐⭐' : quiz.score >= 80 ? '⭐' : '';
            var msg = quiz.score >= 160 ? 'بطل! الدرس اتقفل منك.' : quiz.score >= 120 ? 'كويس جدًا يا جوكر، فاضل تثبيت بسيط.' : quiz.score >= 80 ? 'كويس، راجع الفخاخ وتعالى تاني.' : 'راجع الأقسام وارجع العب.';
            app.innerHTML = quizHead('نتيجة الكويز', pct + '٪', 0, '', 100) +
                '<div class="naat-panel naat-result">' +
                '<div class="naat-score-ring"><span class="naat-score-num">' + quiz.score + '</span><span class="naat-score-total">من ' + total + '</span></div>' +
                '<div class="naat-result-stars">' + stars + '</div>' +
                '<p class="naat-result-msg">' + msg + '</p>' +
                '<div class="naat-result-stats"><span class="naat-stat"><strong>' + quiz.right + '</strong> من ' + DATA.questions.length + ' صح</span>' +
                '<span class="naat-stat">' + icoFlame + ' أطول سلسلة: <strong>' + quiz.best + '</strong></span></div>' +
                '<button type="button" class="naat-btn naat-btn-cta naat-btn-wide" data-action="quiz-restart">العب تاني من الأول</button></div>' + backLink();
            return;
        }
        var q = DATA.questions[quiz.i];
        var progress = Math.round(((quiz.i + (quiz.picked !== null ? 1 : 0)) / DATA.questions.length) * 100);
        var h = quizHead('🎮 كويز النعت', 'نقطك: ' + quiz.score, quiz.streak,
            'سؤال ' + (quiz.i + 1) + ' من ' + DATA.questions.length, progress);
        h += '<div class="naat-panel naat-qcard"><div class="naat-ex-chips">' +
            '<span class="naat-chip naat-chip-num">' + esc(q.topic) + '</span>' +
            '<span class="naat-chip naat-level-' + levelSlug(q.level) + '">' + q.level + '</span></div>' +
            '<p class="naat-q">' + esc(q.q) + '</p><div class="naat-qopts">';
        q.options.forEach(function (opt, oi) {
            var cls = 'naat-opt';
            var mark = '';
            if (quiz.picked !== null) {
                if (oi === q.correct) { cls += ' naat-opt-right'; mark = '<span class="naat-opt-mark">✓</span>'; }
                else if (oi === quiz.picked) { cls += ' naat-opt-wrong'; mark = '<span class="naat-opt-mark">✗</span>'; }
            }
            h += '<button type="button" class="' + cls + '" data-action="quiz-pick" data-oi="' + oi + '">' +
                '<span class="naat-opt-letter">' + letters[oi] + '</span>' +
                '<span class="naat-opt-txt">' + esc(opt) + '</span>' + mark + '</button>';
        });
        h += '</div>';
        if (quiz.picked !== null) {
            h += '<div class="naat-verdict ' + (quiz.picked === q.correct ? 'naat-verdict-right' : 'naat-verdict-wrong') + '">' +
                (quiz.picked === q.correct ? icoParty + ' صح كده يا بطل! +10 نقط' : icoBulb + ' لأ، الصح هو (' + letters[q.correct] + ')') + '</div>' +
                '<div class="naat-solution naat-open"><p>' + esc(q.reason) + '</p></div>' +
                '<button type="button" class="naat-btn naat-btn-cta naat-btn-wide" data-action="quiz-next">' +
                (quiz.i + 1 >= DATA.questions.length ? 'شوف النتيجة' : 'السؤال اللي بعده ⬅') + '</button>';
        }
        app.innerHTML = h + '</div>' + backLink();
    }

    /* ---------- الراوتر ---------- */
    function route() {
        var h = location.hash.replace(/^#/, '') || '/';
        if (h === '/') viewHome();
        else if (h === '/s/tricks') viewTricks();
        else if (h === '/s/examples') viewExamples();
        else if (h === '/s/review') viewReview();
        else if (h === '/quiz') viewQuiz();
        else {
            var sec = null;
            DATA.sections.forEach(function (s) { if ('/s/' + s.id === h) sec = s; });
            if (sec) viewSection(sec); else viewHome();
        }
        window.scrollTo(0, 0);
    }

    /* ---------- الأحداث ---------- */
    document.addEventListener('click', function (e) {
        var nav = e.target.closest('[data-nav]');
        if (nav) { closeMenu(); return; }
        var el = e.target.closest('[data-action]');
        if (!el) return;
        var a = el.getAttribute('data-action');
        if (a === 'open-lib') openMenu();
        else if (a === 'close-lib') closeMenu();
        else if (a === 'reveal') {
            var card = el.closest('.naat-ex');
            var sol = card.querySelector('.naat-solution');
            var open = !sol.classList.contains('naat-open');
            sol.classList.toggle('naat-open', open);
            el.textContent = open ? 'إخفي الحل' : 'أظهر الحل والسبب';
            el.className = open ? 'naat-btn naat-btn-ghost' : 'naat-btn naat-btn-cta';
        } else if (a === 'filter') {
            exFilter = el.getAttribute('data-group');
            viewExamples();
        } else if (a === 'quiz-pick') {
            if (quiz.picked !== null) return;
            var oi = parseInt(el.getAttribute('data-oi'), 10);
            var q = DATA.questions[quiz.i];
            quiz.picked = oi;
            if (oi === q.correct) {
                quiz.score += 10; quiz.right += 1; quiz.streak += 1;
                if (quiz.streak > quiz.best) quiz.best = quiz.streak;
            } else { quiz.streak = 0; }
            viewQuiz();
        } else if (a === 'quiz-next') {
            if (quiz.i + 1 >= DATA.questions.length) quiz.done = true;
            else { quiz.i += 1; quiz.picked = null; }
            viewQuiz();
            window.scrollTo(0, 0);
        } else if (a === 'quiz-restart') quizRestart();
    });

    dlg.addEventListener('click', function (e) { if (e.target === dlg) closeMenu(); });

    buildMenu();
    window.addEventListener('hashchange', route);
    route();
})();
</script>
</body>
</html>
