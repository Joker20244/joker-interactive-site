/* ===== موقع النعت التفاعلي — نسخة مستقلة: كحلي وبرتقالي وكريمي، خط Cairo ===== */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f1ebdc; color: #171f3d; }
.naat-wrap { max-width: 720px; margin: 0 auto; background: #fdfbf3; min-height: 100vh;
    padding: 14px 14px 120px; box-shadow: 0 0 60px #171f3d22; }

/* ----- عناصر أساسية ----- */
.naat-p { font-size: 15.5px; line-height: 2.05; color: #3d4460; margin: 12px 2px; }
.naat-key { background: #fdeede; border: 1px solid #f6dcc0;
    border-inline-start: 6px solid #f97316; border-radius: 14px; padding: 12px 16px;
    font-weight: 800; color: #171f3d; line-height: 2.05; margin: 14px 0; font-size: 15.5px; }
.naat-callout { background: #fdeadd; border: 1px solid #f5d8bd; border-inline-start: 6px solid #f97316;
    border-radius: 16px; padding: 12px 16px; margin: 14px 0; }
.naat-callout-title { font-weight: 900; color: #c2410c; margin: 0 0 4px; font-size: 14.5px; }
.naat-callout p { margin: 0; line-height: 2.05; font-size: 14.5px; color: #5d4a35; }
.naat-closing { text-align: center; color: #8f8672; font-size: 12.5px; line-height: 2; margin: 20px 8px 4px; }

/* ----- جداول ----- */
.naat-table { margin: 14px 0; }
.naat-table-caption { font-weight: 900; font-size: 16.5px; margin: 6px 2px 10px; color: #171f3d;
    padding-inline-start: 12px; border-inline-start: 6px solid #f97316; }
.naat-topt { background: #fdf8ea; border: 1px solid #f3e7ca; border-radius: 16px; padding: 12px 14px;
    margin-block: 10px; box-shadow: 0 8px 18px -14px #171f3d33; }
.naat-topt-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.naat-topt-num { min-width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(150deg, #fb923c, #f97316); color: #fff; font-weight: 900;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
    box-shadow: 0 5px 12px -5px #f97316cc; }
.naat-topt-head strong { font-size: 15.5px; color: #171f3d; }
.naat-trow { display: flex; flex-direction: column; gap: 2px; padding-block: 8px;
    border-block-start: 1px solid #f3ead2; }
.naat-tlabel { font-size: 12px; color: #b07e43; font-weight: 800; }
.naat-tvalue { font-size: 14.5px; line-height: 2; color: #2b3350; }

/* ----- hero الصفحة الرئيسية ----- */
.naat-hero { position: relative; overflow: hidden; border-radius: 24px; padding: 30px 24px 26px;
    background: linear-gradient(165deg, #1c2750 0%, #161f42 55%, #111834 100%); color: #fff;
    box-shadow: 0 20px 42px -20px #111834b3; margin-block: 4px 14px; }
.naat-hero::before { content: ""; position: absolute; inset-inline-end: -64px; top: -76px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fb923c, #f97316 72%); opacity: .92; }
.naat-hero::after { content: ""; position: absolute; inset-inline-start: -46px; bottom: -64px;
    width: 150px; height: 150px; border-radius: 50%; background: #fb923c1f; }
.naat-hero-badge { position: relative; display: inline-block; font-size: 12.5px; font-weight: 800;
    color: #171f3d; background: #ffffff; padding: 6px 15px; border-radius: 999px;
    box-shadow: 0 4px 12px -4px #00000055; }
.naat-hero-title { position: relative; font-size: 38px; font-weight: 900; margin: 16px 0 4px; line-height: 1.25; }
.naat-hero-sub { position: relative; font-size: 15.5px; font-weight: 800; color: #fb923c; margin: 0 0 12px; }
.naat-hero-meta { position: relative; font-size: 12.5px; color: #c7d2e8; margin: 0; line-height: 1.9; }

/* ----- سطر الإشراف ----- */
.naat-credit { display: flex; align-items: center; gap: 12px; margin-block: 0 16px;
    background: #fdeede; border: 1px solid #f5d8bd;
    border-inline-start: 6px solid #f97316; border-radius: 18px; padding: 14px 18px;
    box-shadow: 0 10px 22px -14px #c2410c59; }
.naat-credit-crown { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, #fb923c, #f97316); box-shadow: 0 8px 16px -8px #f97316cc; }
.naat-credit-txt { margin: 0; font-size: 15.5px; font-weight: 800; color: #6b3410; line-height: 1.9; }

.naat-homehint { font-size: 13.5px; color: #4d566e; background: #eef0f7; border: 1px solid #e0e5f2;
    border-radius: 16px; padding: 12px 16px; margin: 0 0 16px; line-height: 2; }

/* ----- كروت الأقسام ----- */
.naat-topics { display: grid; gap: 12px; margin-block: 4px 12px; }
@media (min-width: 768px) { .naat-topics { grid-template-columns: 1fr 1fr; } }
.naat-topic { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 22px 14px 18px; border-radius: 20px; text-decoration: none; text-align: center;
    background: #fff; border: 1px solid #f0ead8; color: #171f3d;
    box-shadow: 0 10px 24px -16px #171f3d4d; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.naat-topic:hover { transform: translateY(-3px); border-color: #f97316;
    box-shadow: 0 0 0 3px #fed7b2, 0 16px 28px -14px #f9731666; }
.naat-topic-num { position: absolute; inset-inline-start: 12px; top: 12px; min-width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
    background: linear-gradient(150deg, #fb923c, #f97316); color: #fff; font-size: 13.5px; font-weight: 900;
    box-shadow: 0 5px 12px -5px #f97316cc; }
.naat-topic-ico { display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 58px;
    border-radius: 18px; font-size: 28px; box-shadow: inset 0 0 0 1px #171f3d14; }
.naat-topic-title { font-size: 16.5px; font-weight: 800; color: #171f3d; }
.naat-topic-desc { font-size: 12.5px; color: #7a8496; line-height: 1.7; }
.naat-topic-quiz { background: linear-gradient(150deg, #fb923c, #f97316); border-color: #f97316;
    box-shadow: 0 16px 30px -14px #f97316aa; }
.naat-topic-quiz .naat-topic-num { background: #171f3d; color: #fb923c; box-shadow: none; }
.naat-topic-quiz .naat-topic-ico { background: #ffffff2e; box-shadow: none; }
.naat-topic-quiz .naat-topic-title { color: #fff; }
.naat-topic-quiz .naat-topic-desc { color: #fff3e2; }

/* ----- زرار المكتبة العائم ----- */
.naat-libfab { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px;
    z-index: 60; display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer;
    font-family: inherit; min-height: 56px; padding: 9px 18px; border-radius: 999px;
    background: linear-gradient(160deg, #1c2750, #111834); color: #fff;
    box-shadow: 0 14px 30px -8px #111834cc, 0 0 0 3px #f9731644;
    transition: transform .14s ease, box-shadow .14s ease; }
.naat-libfab:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -8px #111834d9, 0 0 0 4px #f9731655; }
.naat-libfab:active { transform: scale(.96); }
.naat-libfab-ico { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 50%; font-size: 20px; background: linear-gradient(135deg, #fb923c, #f97316);
    box-shadow: 0 6px 14px -6px #f97316cc; }
.naat-libfab-txt { font-size: 15.5px; font-weight: 800; }

<body>
<div class="naat-wrap" id="app"></div>
<noscript>
<style>.naat-libfab,#app{display:none}</style>
<div class="naat-wrap"><div class="naat-ns-note"><strong>دي نسخة قراية.</strong> المعاينة دي مبتشغلش التفاعل، فكل الحلول مفتوحة وإجابات الكويز متعلّم عليها ✓. عشان قايمة المكتبة والكويز والأزرار يشتغلوا، افتح الملف في متصفح: على أندرويد من «التنزيلات» اختار الفتح بـChrome، وعلى آيفون احفظ الملف في «الملفات» وبعدها افتحه من Safari.</div><div class="naat-hero"><span class="naat-hero-badge">درس نحو تفاعلي</span><h1 class="naat-hero-title">درس النعت</h1><p class="naat-hero-sub">النعت والبدل بالعامية، من غير تعقيد</p><p class="naat-hero-meta">٧ أقسام • ٣٠ مثال محلول • كويز ١٨ سؤال بالنقط</p></div><div class="naat-credit"><span class="naat-credit-crown"><svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff" aria-hidden="true"><path d="M3 8.2 7.2 11.6 12 5l4.8 6.6L21 8.2 19.3 18H4.7Z"/></svg></span><p class="naat-credit-txt">هذا المحتوى صنع تحت إشراف أحمد <span class="naat-credit-name">( Jokerich )</span></p></div><div class="naat-topics"><div class="naat-topic"><span class="naat-topic-num">١</span><span class="naat-topic-ico" style="background:#e0ecff">🔍</span><strong class="naat-topic-title">الفكرة بالعامية</strong><span class="naat-topic-desc">يعني إيه نعت أصلًا؟</span></div><div class="naat-topic"><span class="naat-topic-num">٢</span><span class="naat-topic-ico" style="background:#e6f7ef">✏️</span><strong class="naat-topic-title">القواعد الثابتة</strong><span class="naat-topic-desc">التعريف والأنواع وجدول البدل</span></div><div class="naat-topic"><span class="naat-topic-num">٣</span><span class="naat-topic-ico" style="background:#fff1e0">⚖️</span><strong class="naat-topic-title">النعت والبدل</strong><span class="naat-topic-desc">الفرق بينهم في سطرين</span></div><div class="naat-topic"><span class="naat-topic-num">٤</span><span class="naat-topic-ico" style="background:#fdf0e7">⭐</span><strong class="naat-topic-title">التريكات الامتحانية</strong><span class="naat-topic-desc">٨ تريكات بتحسم السؤال</span></div><div class="naat-topic"><span class="naat-topic-num">٥</span><span class="naat-topic-ico" style="background:#eceaff">📚</span><strong class="naat-topic-title">الأمثلة المحلولة</strong><span class="naat-topic-desc">٣٠ مثال متدرج، والحل بزرار</span></div><div class="naat-topic"><span class="naat-topic-num">٦</span><span class="naat-topic-ico" style="background:#e3f6fb">⚡</span><strong class="naat-topic-title">المراجعة السريعة</strong><span class="naat-topic-desc">كل الدرس في ٣٠ ثانية</span></div><div class="naat-topic naat-topic-quiz"><span class="naat-topic-num">٧</span><span class="naat-topic-ico" style="background:#ffe8ec">🎮</span><strong class="naat-topic-title">كويز النعت</strong><span class="naat-topic-desc">لعبة ١٨ سؤال بالنقط</span></div></div><div class="naat-pagehead"><div class="naat-pagehead-row"><span class="naat-pagehead-ico">🔍</span><div class="naat-pagehead-txt"><span class="naat-kicker">الجزء ١</span><h1 class="naat-pagetitle">الفكرة بالعامية الأول</h1><p class="naat-pagesub">يعني إيه نعت أصلًا؟</p></div></div></div><div class="naat-sectionbody"><p class="naat-p">بص يا جوكر، النعت ببساطة هو الصفة: كلمة أو جملة بتيجي ورا اسم عشان توصفه أو توضحه. الاسم اللي بيتوصف اسمه المنعوت، والوصف اللي وراه هو النعت.</p><p class="naat-p">لما تقول «قرأت كتابًا ممتعًا»، كلمة "ممتعًا" جايبة صفة الكتاب، يبقى دي نعت. ولما تقول «اشتريت كتابًا يشرح القواعد»، الوصف هنا جملة كاملة ("يشرح القواعد")، وبرضه شغالها إنها توصف الكتاب، يبقى نعت برضه.</p><div class="naat-key">الخلاصة بالعامية: امسك الاسم الأول واسأل «إيه صفته؟»، اللي يجاوبك هو النعت. وبعدها بص على الوصف: كلمة واحدة؟ يبقى نعت مفرد. جملة فيها فعل؟ نعت جملة فعلية. جملة بتبدأ باسم؟ نعت جملة اسمية. جار ومجرور أو ظرف؟ نعت شبه جملة.</div><div class="naat-callout"><p class="naat-callout-title">نقطة بتضحك على ناس كتير</p><p>النعت بيتبع المنعوت في الحالة الإعرابية (رفع/نصب/جر)، مش شرط في نفس الحركة المكتوبة. يعني ممكن المنعوت مجرور بالفتحة (اسم ممنوع من الصرف) والنعت بتاعه مجرور بالكسرة عادي. هتشوف ده بعينك في مثال «مساجد قديمة» في الأمثلة.</p></div></div><div class="naat-pagehead"><div class="naat-pagehead-row"><span class="naat-pagehead-ico">✏️</span><div class="naat-pagehead-txt"><span class="naat-kicker">الجزء ٢</span><h1 class="naat-pagetitle">القواعد الثابتة</h1><p class="naat-pagesub">من الكتاب ص 120</p></div></div></div><div class="naat-sectionbody"><div class="naat-key">تعريف النعت: تابع يصف ما قبله. (يعني وظيفته الأساسية: الوصف).</div><div class="naat-table"><div class="naat-table-caption">أنواع النعت الأربعة</div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">1</span><strong>نعت مفرد</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«يتمتع الإنسان بحقوق أساسية»</span></div><div class="naat-trow"><span class="naat-tlabel">إزاي تعرفه</span><span class="naat-tvalue">كلمة واحدة (مش جملة)، وممكن تكون مثنى أو جمع، المهم إنها مش جملة ولا شبه جملة.</span></div></div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">2</span><strong>نعت جملة فعلية</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«نص الإعلان على حقوق تصون الكرامة»</span></div><div class="naat-trow"><span class="naat-tlabel">إزاي تعرفه</span><span class="naat-tvalue">الوصف جملة فيها فعل.</span></div></div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">3</span><strong>نعت جملة اسمية</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«يحب الفرد مجتمعًا قوانينه عادلة»</span></div><div class="naat-trow"><span class="naat-tlabel">إزاي تعرفه</span><span class="naat-tvalue">الوصف جملة بتبدأ باسم (مبتدأ وخبر).</span></div></div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">4</span><strong>نعت شبه جملة</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«تسعى الدول إلى عدالة فوق الشبهات»</span></div><div class="naat-trow"><span class="naat-tlabel">إزاي تعرفه</span><span class="naat-tvalue">الوصف جار ومجرور أو ظرف.</span></div></div></div><div class="naat-key">قاعدة النعت المفرد: يطابق المنعوت في الإعراب (رفع/نصب/جر)، والتذكير والتأنيث، والتعريف والتنكير، والعدد (إفراد/تثنية/جمع).</div><p class="naat-p">قاعدة نعت الجملة: يشترط فيه ضمير رابط يعود على المنعوت ويطابقه في النوع والعدد. الرابط ممكن يكون مستترًا («كتابًا يشرح» = يشرح هو) أو متصلًا («تحكمه» الهاء). ومش شرط يكون فاعل، ممكن يكون مفعول أو مضاف إليه.</p><p class="naat-p">وشبه الجملة؟ في التعبير المدرسي بنقول: شبه الجملة «في محل ... نعت»، والأدق إن الجار والمجرور أو الظرف متعلق بمحذوف تقديره "كائن/مستقر" بيوصف الاسم. ومش بنطلب ضمير ظاهر جواها زي الجملة التامة.</p><div class="naat-key">تعريف البدل: تابع مقصود بالحكم بالواسطة بينه وبين المتبوع، يوضحه ويتبعه في الإعراب. يعني مش بيوصف، هو نفسه المقصود، بس جاي يوضح أو يخصص اللي قبله.</div><div class="naat-table"><div class="naat-table-caption">أنواع البدل</div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">1</span><strong>بدل كل من كل (المطابق)</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«الفاروق عمر أقام العدل»</span></div><div class="naat-trow"><span class="naat-tlabel">المعنى</span><span class="naat-tvalue">البدل هو عين المبدل منه.</span></div></div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">2</span><strong>بدل بعض من كل</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«قرأت دستور الدولة معظمه»</span></div><div class="naat-trow"><span class="naat-tlabel">المعنى</span><span class="naat-tvalue">البدل جزء من المبدل منه.</span></div></div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">3</span><strong>بدل اشتمال</strong></div><div class="naat-trow"><span class="naat-tlabel">مثال الكتاب</span><span class="naat-tvalue">«يعجبني المجتمع عدله»</span></div><div class="naat-trow"><span class="naat-tlabel">المعنى</span><span class="naat-tvalue">البدل في المبدل منه (محتوى فيه).</span></div></div></div><div class="naat-callout"><p class="naat-callout-title">تنبيه الكتاب</p><p>يشترط في بدل البعض من كل وبدل الاشتمال أن يتصل بكل منهما ضمير عائد على المبدل منه (معظمه، عدله). أما البدل المطابق فلا يحتاج ضميرًا.</p></div></div><div class="naat-pagehead"><div class="naat-pagehead-row"><span class="naat-pagehead-ico">⚖️</span><div class="naat-pagehead-txt"><span class="naat-kicker">الجزء ٣</span><h1 class="naat-pagetitle">الفرق بين النعت والبدل في سطرين</h1><p class="naat-pagesub">جدول المقارنة السريع</p></div></div></div><div class="naat-sectionbody"><div class="naat-table"><div class="naat-table-caption">النعت والبدل جنب بعض</div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">1</span><strong>النعت</strong></div><div class="naat-trow"><span class="naat-tlabel">الوظيفة</span><span class="naat-tvalue">يصف ما قبله (وصف إضافي)</span></div><div class="naat-trow"><span class="naat-tlabel">اختبار سريع</span><span class="naat-tvalue">لو شلته، الجملة تفضل سليمة بس ناقصة وصف</span></div><div class="naat-trow"><span class="naat-tlabel">الضمير الرابط</span><span class="naat-tvalue">شرط في نعت الجملة (فعلية/اسمية)</span></div><div class="naat-trow"><span class="naat-tlabel">مثال</span><span class="naat-tvalue">«جاء المعلم الفاضل»</span></div></div><div class="naat-topt"><div class="naat-topt-head"><span class="naat-topt-num">2</span><strong>البدل</strong></div><div class="naat-trow"><span class="naat-tlabel">الوظيفة</span><span class="naat-tvalue">هو المقصود بالحكم، يوضح المبدل منه</span></div><div class="naat-trow"><span class="naat-tlabel">اختبار سريع</span><span class="naat-tvalue">لو شلت المبدل منه وحطيت البدل مكانه، الجملة تفضل مفيدة بنفس المعنى</span></div><div class="naat-trow"><span class="naat-tlabel">الضمير الرابط</span><span class="naat-tvalue">شرط في بدل البعض والاشتمال فقط، مش المطابق</span></div><div class="naat-trow"><span class="naat-tlabel">مثال</span><span class="naat-tvalue">«جاء المعلم أحمد»</span></div></div></div><div class="naat-key">السطرين اللي يحسموها: النعت بيوصف، البدل بيساوي.</div></div><div class="naat-pagehead"><div class="naat-pagehead-row"><span class="naat-pagehead-ico">⭐</span><div class="naat-pagehead-txt"><span class="naat-kicker">الجزء ٤</span><h1 class="naat-pagetitle">التريكات الامتحانية</h1><p class="naat-pagesub">٨ تريكات بتحسم السؤال</p></div></div></div><div class="naat-tricks"><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">١</span><strong>سؤال الوصف</strong></div><p class="naat-p">امسك الاسم اللي قبل الوصف واسأل «إيه صفته؟». اللي يجاوب هو النعت. لو الكلمة مش بتصف حاجة (بتحدد الشخص أو الجزء) يبقى على طول فكر في البدل.</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٢</span><strong>طابق الحالة مش الحركة</strong></div><p class="naat-p">حدد إعراب المنعوت الأول، والنعت المفرد زيه في الرفع/النصب/الجر. بس خلي بالك: التطابق في الحالة مش في العلامة، المنعوت ممكن يكون مجرور بالفتحة (ممنوع من الصرف) والنعت مجرور بالكسرة. ده فخ الاختيارات الأشهر.</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٣</span><strong>«بعد النكرات صفات، وبعد المعارف أحوال»</strong></div><p class="naat-p">قاعدة ترجيح سريعة: الجملة أو شبه الجملة بعد اسم نكرة غالبًا نعت، وبعد معرفة غالبًا حال أو متعلق بالفعل. بس مش قانون مطلق: لازم تراجع المعنى وتتأكد إن الكلام فعلًا بيوصف الاسم مش بيحكي عن ظرف الفعل.</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٤</span><strong>دور على الرابط</strong></div><p class="naat-p">نعت الجملة لازم فيه ضمير بيعود على المنعوت ويطابقه في النوع والعدد. الضمير ممكن يكون مستتر («كتابًا يشرح» = يشرح هو)، أو متصل في أي موقع: فاعل («تحكمه»)، مفعول («ينصفه القاضي»)، أو مضاف إليه («قوانينه عادلة»). مفيش رابط؟ يبقى الجملة مش نعت، راجع حساباتك.</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٥</span><strong>الجملة مبتتعربش بحركة</strong></div><p class="naat-p">متقولش "الجملة مرفوعة بالضمة". الصواب: «الجملة في محل رفع/نصب/جر نعت»، وبعدها تعرب كلمات الجملة جواها كل واحدة بموقعها عادي.</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٦</span><strong>النعت ممكن يتباعد</strong></div><p class="naat-p">النعت مش لازم يلزق في منعوته؛ ممكن يفصل بينهم مضاف إليه أو نعت تاني: «أعجبتني قصيدةُ الشاعرِ الجميلةُ»، الجميلة نعت لقصيدة (مرفوعة زيها) مش للشاعر، والضبط هو اللي بيحدد الموصوف.</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٧</span><strong>فخ "نكرة + نكرة"</strong></div><p class="naat-p">مجيء نكرة بعد معرفة أو نكرة بعد نكرة مش كفاية لوحده عشان تحكم بنعت، لازم دلالة الوصف: «اشتريت خاتمَ فضةٍ» فضة مضاف إليه مش نعت، و«زار القاهرةَ عاصمةَ مصرَ» عاصمة بدل مش نعت. اسأل: بتوصف ولا بتحدد المقصود؟</p></div><div class="naat-trick"><div class="naat-trick-head"><span class="naat-num">٨</span><strong>جمع غير العاقل</strong></div><p class="naat-p">وصف جمع غير العاقل (مساجد، قصص) بالمفرد المؤنث صحيح ووارد: «مساجدَ قديمةٌ». متستغربش ومتعدلش على الآخر من غير ما تراجع.</p></div></div><div class="naat-pagehead"><div class="naat-pagehead-row"><span class="naat-pagehead-ico">📚</span><div class="naat-pagehead-txt"><span class="naat-kicker">الجزء ٥</span><h1 class="naat-pagetitle">الأمثلة المحلولة</h1><p class="naat-pagesub">٣٠ مثال من السهل للتحدّي</p></div></div></div><div class="naat-exgroup"><h2 class="naat-exgroup-title">أولًا: النعت المفرد</h2><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ١</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-sentence">حَضَرَ طالبٌ مجتهدٌ.</p><div class="naat-solution naat-open"><p>مجتهدٌ: نعت مفرد مرفوع وعلامة رفعه الضمة. منعوته «طالب» فاعل مرفوع، والنعت يتبعه في الرفع. الاتنين نكرة، مفرد، مذكر، المطابقة كاملة.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٢</span><span class="naat-chip naat-level-easyplus">سهل+</span></div><p class="naat-sentence">شاهدتُ حديقةً جميلةً.</p><div class="naat-solution naat-open"><p>جميلةً: نعت مفرد منصوب وعلامة نصبه الفتحة؛ لأن منعوته «حديقةً» مفعول به منصوب. وطابقها في التنكير والإفراد والتأنيث.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٣</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-sentence">سَلّمتُ على الطالبَينِ المجتهدَينِ.</p><div class="naat-solution naat-open"><p>المجتهدَينِ: نعت مفرد مجرور وعلامة جره الياء لأنه مثنى، ومنعوته «الطالبَينِ» اسم مجرور بـ"على" وعلامة جره الياء. انتبه: كلمة النعت هنا مثنى، لكن نوع النعت "مفرد" لأنه مش جملة ولا شبه جملة؛ "مفرد" هنا وصف لصورة التركيب مش للعدد.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٤</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-sentence">كَرّمتُ الطالباتِ المجتهداتِ.</p><div class="naat-solution naat-open"><p>المجتهداتِ: نعت مفرد منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم؛ ومنعوته «الطالباتِ» مفعول به منصوب بالكسرة برضه. الفخ: الكسرة هنا علامة نصب مش جر، متتخدعش بالشكل، بص على موقع الكلمة في الجملة.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٥</span><span class="naat-chip naat-level-challenge">تحدٍّ</span></div><p class="naat-sentence">مررتُ بمساجدَ قديمةٍ جميلةٍ.</p><div class="naat-solution naat-open"><p>«مساجدَ»: اسم مجرور بالباء وعلامة جره الفتحة لأنه ممنوع من الصرف (صيغة منتهى الجموع، غير مضاف ولا مقترن بأل). قديمةٍ: نعت مفرد مجرور وعلامة جره الكسرة. جميلةٍ: نعت ثانٍ مجرور وعلامة جره الكسرة. المفرد المؤنث مناسب هنا لجمع غير العاقل. لاحظ: الكلمات اتفقت في الجر واختلفت علامات الجر، ودي أصغر وأخطر نقطة في الدرس كله.</p></div></div></div><div class="naat-exgroup"><h2 class="naat-exgroup-title">ثانيًا: نعت الجملة الفعلية</h2><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ١</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-sentence">جاءَ طفلٌ يبتسمُ.</p><div class="naat-solution naat-open"><p>جملة «يبتسمُ» الفعلية في محل رفع نعت لـ«طفل» (فاعل مرفوع). فاعل «يبتسم» ضمير مستتر تقديره "هو"، وهو الرابط العائد على طفل.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٢</span><span class="naat-chip naat-level-easyplus">سهل+</span><span class="naat-chip naat-chip-book">من الكتاب ص 120</span></div><p class="naat-sentence">نَصَّ الإعلانُ على حقوقٍ تصونُ الكرامةَ.</p><div class="naat-solution naat-open"><p>جملة «تصونُ الكرامةَ» الفعلية في محل جر نعت لـ«حقوقٍ» (مجرورة بـ"على"). فاعل «تصون» ضمير مستتر تقديره "هي" يعود على حقوق، ده الرابط المطابق في النوع والعدد (جمع غير عاقل = مؤنث مفرد).</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٣</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-sentence">مررتُ بحديقةٍ تتفتّحُ أزهارُها.</p><div class="naat-solution naat-open"><p>الجملة الفعلية في محل جر نعت لـ«حديقةٍ». «أزهارُها» فاعل ظاهر مرفوع، والهاء المتصلة به هي الرابط. الفخ: متخترعش فاعلًا مستترًا طالما فيه فاعل ظاهر، الرابط مش لازم يكون هو الفاعل.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٤</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-sentence">قرأتُ كتابًا لم يفقدْ قيمتَه.</p><div class="naat-solution naat-open"><p>جملة «لم يفقدْ قيمتَه» الفعلية في محل نصب نعت لـ«كتابًا». «يفقدْ» فعل مضارع مجزوم بـ"لم" وعلامة جزمه السكون، فاعله ضمير مستتر تقديره "هو" يعود على الكتاب، والهاء في «قيمته» تعود عليه برضه. الفخ: وجود "لم" أو "ال" قبل الفعل مبيحولش الجملة لاسمية، طالما البداية فعل تفضل فعلية.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٥</span><span class="naat-chip naat-level-challenge">تحدٍّ</span></div><p class="naat-sentence">قابلتُ رجلًا ينصفُهُ القاضي.</p><div class="naat-solution naat-open"><p>جملة «ينصفُهُ القاضي» الفعلية في محل نصب نعت لـ«رجلًا». «القاضي» فاعل مرفوع، والهاء في «ينصفُهُ» مفعول به، وهي الرابط العائد على «رجلًا». الفخ القاتل: الرابط مش دايمًا فاعل الفعل؛ هنا الرجل هو اللي بيتنصف (مفعول)، والقاضي هو اللي بينصف (فاعل). اسأل نفسك: مين الضمير اللي بيرجع على المنعوت؟ مش مين الفاعل.</p></div></div></div><div class="naat-exgroup"><h2 class="naat-exgroup-title">ثالثًا: نعت الجملة الاسمية</h2><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ١</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-sentence">هذا طالبٌ أخلاقُهُ كريمةٌ.</p><div class="naat-solution naat-open"><p>جملة «أخلاقُهُ كريمةٌ» الاسمية في محل رفع نعت لـ«طالب» (خبر "هذا" مرفوع). «أخلاقٌ» مبتدأ، والهاء مضاف إليه وهي الرابط، و«كريمةٌ» خبر.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٢</span><span class="naat-chip naat-level-easyplus">سهل+</span><span class="naat-chip naat-chip-book">من الكتاب ص 120</span></div><p class="naat-sentence">يُحِبُّ الفردُ مجتمعًا قوانينُهُ عادلةٌ.</p><div class="naat-solution naat-open"><p>جملة «قوانينُهُ عادلةٌ» الاسمية في محل نصب نعت لـ«مجتمعًا» (مفعول به). «قوانينٌ» مبتدأ مرفوع، والهاء مضاف إليه وهي الرابط العائد على مجتمع، و«عادلةٌ» خبر مرفوع، جوّا الجملة، حتى لو الجملة كلها في محل نصب.</p></div></div><div class="naat-ex"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">المثال ٣</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-sentence">سمعتُ فتاةً صوتُها هادئٌ.</p><div class="naat-solution naat-open"><p>الجملة الاسمية في محل نصب نعت لـ«فتاةً». «صوتٌ» مبتدأ، الهاء رابط ومضاف إليه، «هادئٌ» خبر. الفخ: «صوت» مذكر و«هادئ» مذكر، وده طبيعي، لأن المبتدأ والخبر جوا الجملة بيوصفوا "صوتها" مش "فتاة" نفسها؛ اللي بيطابق فتاة هو الرابط (الهاء المؤنثة) مش كلمات ا row"><span class="naat-review-check">✓</span><span class="naat-review-text">النعت تابع يصف ما قبله، والموصوف اسمه المنعوت.</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">النعت المفرد يطابق المنعوت في: الإعراب + التذكير/التأنيث + التعريف/التنكير + العدد (في الحالة مش في العلامة!).</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">نعت الجملة (فعلية أو اسمية): لازم ضمير رابط يعود على المنعوت ويطابقه في النوع والعدد، والرابط مش شرط يكون فاعل.</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">شبه الجملة نعت: متعلقة بمحذوف تقديره "كائن" يصف الاسم، وتعرب «في محل ... نعت».</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">الجملة تعرب «في محل» وكلماتها تعرب داخليًا، مفيش جملة "مرفوعة بالضمة".</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">البدل مقصود بالحكم ويوضح المبدل منه: مطابق (بدون ضمير)، بعض من كل (بضمير)، اشتمال (بضمير).</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">التمييز: شيل المبدل منه وحط البدل مكانه، الجملة فضلت بنفس المعنى؟ بدل. المعنى اتغير؟ نعت.</span></div><div class="naat-review-row"><span class="naat-review-check">✓</span><span class="naat-review-text">بعد النكرة غالبًا نعت، بعد المعرفة غالبًا حال، وسيلة ترجيح، والمعنى هو الحكم.</span></div></div><div class="naat-callout"><p class="naat-callout-title">مصدر الدرس</p><p>اتبنى على صفحة 120 من كتاب الوحدة الثالثة (هيا نوظف لغتنا الجميلة: اضبط لغتك)، مع أمثلة تدريبية إضافية متدرجة للتثبيت. الأمثلة المكتوب عليها «من الكتاب ص 120» منقولة من المنهج، والباقي تدريب إضافي بنفس مستوى الامتحان. بالتوفيق يا جوكر.</p></div><div class="naat-pagehead"><div class="naat-pagehead-row"><span class="naat-pagehead-ico">🎮</span><div class="naat-pagehead-txt"><span class="naat-kicker">الجزء ٧</span><h1 class="naat-pagetitle">كويز النعت</h1><p class="naat-pagesub">١٨ سؤال — الصح متعلّم عليه ✓</p></div></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">النعت المفرد</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-q">1. في جملة «حضر طالبٌ مجتهدٌ»، كلمة «مجتهدٌ» تعرب إيه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">حال منصوب وعلامة نصبه الفتحة</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">بدل كل من كل مرفوع</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">نعت مفرد مرفوع وعلامة رفعه الضمة</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">مضاف إليه مجرور</span></div></div><div class="naat-solution naat-open"><p>«مجتهد» كلمة واحدة بتوصف «طالب»، والنعت المفرد بيطابق منعوته في الإعراب؛ «طالب» فاعل مرفوع، يبقى النعت مرفوع بالضمة زيه.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">النعت المفرد</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-q">2. النعت المفرد بيطابق المنعوت في إيه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">في نفس الحركة المكتوبة على آخر الكلمة دايمًا</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">في الحالة الإعرابية والتذكير والتأنيث والتعريف والتنكير والعدد</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">في التعريف والتنكير بس</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">في العدد بس</span></div></div><div class="naat-solution naat-open"><p>النعت المفرد بيطابق منعوته في الإعراب (رفع/نصب/جر) + التذكير والتأنيث + التعريف والتنكير + العدد. والمهم: المطابقة في الحالة مش في علامة الإعراب نفسها.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">النعت المفرد</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">3. في جملة «مررتُ بمساجدَ قديمةٍ جميلةٍ»، إيه الصواب في إعراب الكلمات الثلاث؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">«قديمة» نعت مجرور بالفتحة زي «مساجد» لأن النعت لازم يطابق حركة منعوته</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">«قديمة» و«جميلة» حال منصوب لأنهم بيوصفوا</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">«جميلة» بدل من «قديمة» لأنهم ورا بعض</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">«مساجدَ» مجرور بالفتحة لأنه ممنوع من الصرف، و«قديمةٍ» نعت مجرور بالكسرة، و«جميلةٍ» نعت ثانٍ مجرور بالكسرة</span><span class="naat-opt-mark">✓</span></div></div><div class="naat-solution naat-open"><p>«مساجد» مجرور بالباء وعلامة جره الفتحة لأنه ممنوع من الصرف. النعت بيتبعه في الجر مش في علامة الجر، فالكسرة صح. والمفرد المؤنث مناسب لوصف جمع غير العاقل.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">النعت المفرد</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">4. في جملة «كرمتُ الطالباتِ المجتهداتِ»، علامة نصب «المجتهداتِ» هي:</p><div class="naat-qopts"><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">الفتحة الظاهرة على آخره</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">الكسرة لأنه مجرور بالإضافة</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">الياء لأنه جمع</span></div></div><div class="naat-solution naat-open"><p>جمع المؤنث السالم بينصب بالكسرة نيابة عن الفتحة، و«الطالبات» المنعوت منصوب بالكسرة برضه. الموقع في الجملة (مفعول به) هو اللي بيحدد إن الكسرة هنا نصب مش جر.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الفعلية</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-q">5. في جملة «جاء طفلٌ يبتسمُ»، جملة «يبتسم» تعرب إيه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">جملة فعلية في محل نصب حال</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">جملة فعلية لا محل لها من الإعراب</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">جملة فعلية في محل رفع نعت لـ«طفل»</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">جملة فعلية في محل رفع خبر</span></div></div><div class="naat-solution naat-open"><p>الجملة بتوصف «طفل»، وفاعل «يبتسم» ضمير مستتر تقديره «هو» راجع على طفل، وده الرابط المطلوب في نعت الجملة. «طفل» فاعل مرفوع، يبقى الجملة في محل رفع نعت.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الفعلية</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-q">6. في جملة «نصَّ الإعلانُ على حقوقٍ تصونُ الكرامةَ»، الرابط في جملة النعت هو:</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">الواو في «تصون» راجعة على «حقوق» باعتبارها جمع مذكر</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">مفيش رابط لأن الجملة فعلية</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">ضمير مستتر تقديره «هم» لأن «حقوق» جمع</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">ضمير مستتر تقديره «هي» فاعل «تصون»، عائد على «حقوق»</span><span class="naat-opt-mark">✓</span></div></div><div class="naat-solution naat-open"><p>فاعل «تصون» ضمير مستتر تقديره «هي» بيعود على «حقوق»، والرابط بيطابق المنعوت في النوع والعدد: جمع غير العاقل بيعامل معاملة المفرد المؤنث.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الفعلية</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">7. في جملة «قابلتُ رجالًا ينصفُهم القاضي»، مين الرابط العائد على «رجالًا» وإيه موقعه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">«القاضي»، وهو فاعل مرفوع</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">الضمير المتصل «هم» في «ينصفُهم»، وهو في محل نصب مفعول به</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">مفيش رابط صريح في الجملة</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">ضمير مستتر تقديره «هم»، وهو فاعل «ينصف»</span></div></div><div class="naat-solution naat-open"><p>«القاضي» هو الفاعل (اللي بينصف)، والضمير المتصل «هم» في «ينصفهم» مفعول به وهو اللي بيرجع على «رجالًا». الرابط مش شرط يكون فاعل: ممكن يكون مفعول أو مضاف إليه.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الفعلية</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-q">8. في جملة «قرأتُ كتابًا لم يفقدْ قيمتَهُ»، جملة «لم يفقدْ قيمته»:</p><div class="naat-qopts"><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">جملة فعلية في محل نصب نعت لـ«كتابًا»</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">جملة اسمية في محل نصب نعت لأنها بدأت بـ«لم»</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">جملة فعلية لا محل لها لأن الفعل مجزوم</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">جملة فعلية في محل رفع نعت</span></div></div><div class="naat-solution naat-open"><p>وجود «لم» قبل الفعل مبيحولش الجملة لاسمية؛ طالما البداية فعل تفضل فعلية. «كتابًا» مفعول به منصوب، يبقى الجملة في محل نصب نعت. والهاء في «قيمته» رابط تاني عائد على الكتاب.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الاسمية</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-q">9. في جملة «هذا طالبٌ أخلاقُهُ كريمةٌ»، جملة «أخلاقه كريمة» تعرب إيه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">جملة اسمية في محل رفع خبر «هذا»</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">جملة اسمية لا محل لها من الإعراب</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">«كريمة» نعت مفرد لـ«طالب» ومفيش جملة أصلًا</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">جملة اسمية في محل رفع نعت لـ«طالبٌ»</span><span class="naat-opt-mark">✓</span></div></div><div class="naat-solution naat-open"><p>الجملة بدأت باسم («أخلاق» مبتدأ) يبقى اسمية، وفيها الهاء مضاف إليه وهي الرابط العائد على «طالب». «طالب» خبر «هذا» مرفوع، يبقى الجملة في محل رفع نعت.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الاسمية</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-q">10. في جملة «سمعتُ فتاةً صوتُها هادئٌ»، إعراب «هادئٌ» هو:</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">نعت منصوب لـ«فتاةً»</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">حال منصوب</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">خبر مرفوع وعلامة رفعه الضمة</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">مبتدأ مرفوع</span></div></div><div class="naat-solution naat-open"><p>«هادئ» خبر للمبتدأ «صوت» جوا جملة النعت، ومرفوع حتى لو الجملة كلها في محل نصب. الجملة تعرب «في محل» وكلماتها تتعرب داخليًا. «هادئ» مذكر لأنه بيوصف «صوتها» مش «فتاة»؛ اللي بيطابق فتاة هو الرابط (الهاء المؤنثة).</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت الجملة الاسمية</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">11. في جملة «تحدثتُ إلى طلابٍ آباؤُهم يدافعونَ عن الحقِّ»، جملة النعت نوعها إيه وليه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">جملة فعلية في محل جر نعت، لأن فيها الفعل «يدافعون»</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">جملة اسمية في محل جر نعت، لأنها بدأت باسم («آباؤهم»)</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">جملة اسمية لا محل لها من الإعراب</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">جملة فعلية في محل رفع نعت</span></div></div><div class="naat-solution naat-open"><p>بص على أول كلمة في جملة النعت: «آباؤهم» اسم (مبتدأ مرفوع بالضمة)، يبقى الجملة الكبيرة اسمية، و«هم» مضاف إليه وهو الرابط. وجملة «يدافعون عن الحق» الفعلية جواها في محل رفع خبر للمبتدأ. وجود فعل جوا الجملة ميخليش النعت فعليًا.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت شبه الجملة</span><span class="naat-chip naat-level-easy">سهل</span></div><p class="naat-q">12. في جملة «هذا كتابٌ عن الفضاءِ»، شبه الجملة «عن الفضاء» تعرب إيه؟</p><div class="naat-qopts"><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">جار ومجرور متعلقان بمحذوف في محل رفع نعت لـ«كتابٌ»</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">جار ومجرور متعلقان بالفعل</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">حال منصوب</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">مضاف إليه مجرور</span></div></div><div class="naat-solution naat-open"><p>«عن الفضاء» بتوصف موضوع الكتاب نفسه، فهي متعلقة بمحذوف تقديره «كائن» بيوصف الاسم، وتعرب «في محل رفع نعت» لأن «كتاب» خبر «هذا» مرفوع. ومش بنطلب ضمير ظاهر جوا شبه الجملة.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت شبه الجملة</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">13. في جملة «أقمتُ في منزلٍ بجوارِ المدرسةِ»، إعراب «بجوار المدرسة» هو:</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">شبه جملة متعلقة بالفعل «أقمت»</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">«جوار» مضاف إليه مجرور</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">شبه جملة في محل رفع نعت</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">شبه جملة في محل جر نعت لـ«منزلٍ»</span><span class="naat-opt-mark">✓</span></div></div><div class="naat-solution naat-open"><p>«بجوار المدرسة» بتوصف المنزل (منزل إيه؟ اللي جنب المدرسة)، فهي متعلقة بمحذوف نعت لـ«منزلٍ» المجرور. أما «في منزل» نفسها فمتعلقة بالفعل «أقمت» (أقمت فين؟ في منزل) ومش نعت. متدخلش كل الجروا والمجرورات في بعض.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت شبه الجملة</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">14. في جملة «ثمنُ قلمٍ من الذهبِ مرتفعٌ»، شبه الجملة «من الذهب» في محل:</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">رفع نعت لـ«ثمنُ»</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">رفع خبر للمبتدأ «ثمن»</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">جر نعت لـ«قلمٍ»</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">نصب حال</span></div></div><div class="naat-solution naat-open"><p>اسأل مين الموصوف فعلًا؟ القلم المصنوع من ذهب، مش الثمن. «قلم» مضاف إليه مجرور، يبقى شبه الجملة في محل جر نعت. «ثمن» مبتدأ مرفوع و«مرتفع» خبره.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">البدل</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-q">15. في جملة «قرأتُ دستورَ الدولةِ معظمَهُ»، كلمة «معظمَهُ» تعرب إيه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">نعت مفرد منصوب لـ«دستور»</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">بدل بعض من كل من «دستورَ»، منصوب بالفتحة</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">بدل كل من كل من «الدولةِ»</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">مفعول به ثانٍ منصوب</span></div></div><div class="naat-solution naat-open"><p>المعظم جزء من الدستور، يبقى بدل بعض من كل، بيتبع المبدل منه في الإعراب (منصوب). والهاء ضمير عائد على الدستور، والضمير مطلوب في بدل البعض من كل. «الدولة» مضاف إليه فاصل بين البدل والمبدل منه وده وارد.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">البدل</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">16. في جملة «تكفلُ بلادُنا مصرُ للمواطنِ حقوقَهُ الأساسيةَ»، كلمة «مصرُ» بدل كل من كل من «بلادنا» ومفيهاش ضمير. ده صحيح ليه؟</p><div class="naat-qopts"><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">البدل المطابق لا يحتاج ضميرًا؛ الضمير مطلوب في بدل البعض من كل وبدل الاشتمال</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">كل أنواع البدل لازم يتصل بيها ضمير عائد على المبدل منه</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">الضمير ممنوع في كل أنواع البدل</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">الأعلام زي «مصر» مبتاخدش بدل أصلًا</span></div></div><div class="naat-solution naat-open"><p>البدل المطابق هو عين المبدل منه، فمش محتاج ضمير يربطه بيه؛ الضمير مطلوب في بدل البعض وبدل الاشتمال بس. والبدل بيتبع المبدل منه: «بلادُنا» فاعل مرفوع، فـ«مصرُ» مرفوعة بالضمة زيها.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت ولا بدل؟</span><span class="naat-chip naat-level-mid">متوسط</span></div><p class="naat-q">17. في جملة «الفاروقُ عمرُ أقامَ العدلَ»، كلمة «عمرُ» تعرب إيه؟</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">نعت مفرد مرفوع لـ«الفاروق»</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">مبتدأ مرفوع و«الفاروق» خبره</span></div><div class="naat-opt"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">حال منصوب</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">بدل كل من كل من «الفاروقُ» مرفوع بالضمة</span><span class="naat-opt-mark">✓</span></div></div><div class="naat-solution naat-open"><p>«عمر» هو عين «الفاروق»، اللقب والاسم بيدلوا على نفس الشخص، فده تحديد للمقصود مش وصف. «الفاروق» مبتدأ مرفوع، يبقى «عمر» بدل مطابق مرفوع، والمطابق مش محتاج ضمير. التجربة الذهبية: «عمرُ أقامَ العدلَ» جملة مفيدة بنفس المعنى، يبقى بدل.</p></div></div><div class="naat-panel naat-qcard"><div class="naat-ex-chips"><span class="naat-chip naat-chip-num">نعت ولا بدل؟</span><span class="naat-chip naat-level-hard">صعب</span></div><p class="naat-q">18. «يجب أن يخضعَ الجميعُ لقوانينَ ...... تحمي الحرياتِ»، اختر الضبط الصحيح للفراغ:</p><div class="naat-qopts"><div class="naat-opt"><span class="naat-opt-letter">أ</span><span class="naat-opt-txt">عادلةً (تنوين فتح)</span></div><div class="naat-opt"><span class="naat-opt-letter">ب</span><span class="naat-opt-txt">عادلةٌ (تنوين ضم)</span></div><div class="naat-opt naat-opt-right"><span class="naat-opt-letter">ج</span><span class="naat-opt-txt">عادلةٍ (تنوين كسر)</span><span class="naat-opt-mark">✓</span></div><div class="naat-opt"><span class="naat-opt-letter">د</span><span class="naat-opt-txt">عادلةُ (ضمة)</span></div></div><div class="naat-solution naat-open"><p>«عادلة» نعت مفرد مجرور بالكسرة لأن منعوتها «قوانينَ» اسم مجرور باللام في «يخضع لـ». وجملة «تحمي الحريات» الفعلية في محل جر نعت ثانٍ، فاعلها ضمير مستتر «هي» عائد على قوانين. اللي بيحسم هو إعراب المنعوت مش شكل الكلمة.</p></div></div><p class="naat-closing">اتبنى على ملخص الدرس المعتمد، وكل الأمثلة المحلولة محفوظة بالكامل. اختياراتك في الكويز على جهازك بس.</p></div>
</noscript>

<script>const DATA = {"sections":[{"id":"idea","num":"١","title":"الفكرة بالعامية الأول","subtitle":"يعني إيه نعت أصلًا؟","blocks":[{"kind":"paragraph","text":"بص يا جوكر، النعت ببساطة هو الصفة: كلمة أو جملة بتيجي ورا اسم عشان توصفه أو توضحه. الاسم اللي بيتوصف اسمه المنعوت، والوصف اللي وراه هو النعت."},{"kind":"paragraph","text":"لما تقول «قرأت كتابًا ممتعًا»، كلمة \"ممتعًا\" جايبة صفة الكتاب، يبقى دي نعت. ولما تقول «اشتريت كتابًا يشرح القواعد»، الوصف هنا جملة كاملة (\"يشرح القواعد\")، وبرضه شغالها إنها توصف الكتاب، يبقى نعت برضه."},{"kind":"key","text":"الخلاصة بالعامية: امسك الاسم الأول واسأل «إيه صفته؟»، اللي يجاوبك هو النعت. وبعدها بص على الوصف: كلمة واحدة؟ يبقى نعت مفرد. جملة فيها فعل؟ نعت جملة فعلية. جملة بتبدأ باسم؟ نعت جملة اسمية. جار ومجرور أو ظرف؟ نعت شبه جملة."},{"kind":"callout","title":"نقطة بتضحك على ناس كتير","text":"النعت بيتبع المنعوت في الحالة الإعرابية (رفع/نصب/جر)، مش شرط في نفس الحركة المكتوبة. يعني ممكن المنعوت مجرور بالفتحة (اسم ممنوع من الصرف) والنعت بتاعه مجرور بالكسرة عادي. هتشوف ده بعينك في مثال «مساجد قديمة» في الأمثلة."}]},{"id":"rules","num":"٢","title":"القواعد الثابتة","subtitle":"من الكتاب ص 120","blocks":[{"kind":"key","text":"تعريف النعت: تابع يصف ما قبله. (يعني وظيفته الأساسية: الوصف)."},{"kind":"table","table":{"caption":"أنواع النعت الأربعة","style":"items","columns":["النوع","مثال الكتاب","إزاي تعرفه"],"rows":[["نعت مفرد","«يتمتع الإنسان بحقوق أساسية»","كلمة واحدة (مش جملة)، وممكن تكون مثنى أو جمع، المهم إنها مش جملة ولا شبه جملة."],["نعت جملة فعلية","«نص الإعلان على حقوق تصون الكرامة»","الوصف جملة فيها فعل."],["نعت جملة اسمية","«يحب الفرد مجتمعًا قوانينه عادلة»","الوصف جملة بتبدأ باسم (مبتدأ وخبر)."],["نعت شبه جملة","«تسعى الدول إلى عدالة فوق الشبهات»","الوصف جار ومجرور أو ظرف."]]}},{"kind":"key","text":"قاعدة النعت المفرد: يطابق المنعوت في الإعراب (رفع/نصب/جر)، والتذكير والتأنيث، والتعريف والتنكير، والعدد (إفراد/تثنية/جمع)."},{"kind":"paragraph","text":"قاعدة نعت الجملة: يشترط فيه ضمير رابط يعود على المنعوت ويطابقه في النوع والعدد. الرابط ممكن يكون مستترًا («كتابًا يشرح» = يشرح هو) أو متصلًا («تحكمه» الهاء). ومش شرط يكون فاعل، ممكن يكون مفعول أو مضاف إليه."},{"kind":"paragraph","text":"وشبه الجملة؟ في التعبير المدرسي بنقول: شبه الجملة «في محل ... نعت»، والأدق إن الجار والمجرور أو الظرف متعلق بمحذوف تقديره \"كائن/مستقر\" بيوصف الاسم. ومش بنطلب ضمير ظاهر جواها زي الجملة التامة."},{"kind":"key","text":"تعريف البدل: تابع مقصود بالحكم بالواسطة بينه وبين المتبوع، يوضحه ويتبعه في الإعراب. يعني مش بيوصف، هو نفسه المقصود، بس جاي يوضح أو يخصص اللي قبله."},{"kind":"table","table":{"caption":"أنواع البدل","style":"items","columns":["نوع البدل","مثال الكتاب","المعنى"],"rows":[["بدل كل من كل (المطابق)","«الفاروق عمر أقام العدل»","البدل هو عين المبدل منه."],["بدل بعض من كل","«قرأت دستور الدولة معظمه»","البدل جزء من المبدل منه."],["بدل اشتمال","«يعجبني المجتمع عدله»","البدل في المبدل منه (محتوى فيه)."]]}},{"kind":"callout","title":"تنبيه الكتاب","text":"يشترط في بدل البعض من كل وبدل الاشتمال أن يتصل بكل منهما ضمير عائد على المبدل منه (معظمه، عدله). أما البدل المطابق فلا يحتاج ضميرًا."}]},{"id":"compare","num":"٣","title":"الفرق بين النعت والبدل في سطرين","subtitle":"جدول المقارنة السريع","blocks":[{"kind":"table","table":{"caption":"النعت والبدل جنب بعض","style":"attrs","columns":["وجه المقارنة","النعت","البدل"],"rows":[["الوظيفة","يصف ما قبله (وصف إضافي)","هو المقصود بالحكم، يوضح المبدل منه"],["اختبار سريع","لو شلته، الجملة تفضل سليمة بس ناقصة وصف","لو شلت المبدل منه وحطيت البدل مكانه، الجملة تفضل مفيدة بنفس المعنى"],["الضمير الرابط","شرط في نعت الجملة (فعلية/اسمية)","شرط في بدل البعض والاشتمال فقط، مش المطابق"],["مثال","«جاء المعلم الفاضل»","«جاء المعلم أحمد»"]]}},{"kind":"key","text":"السطرين اللي يحسموها: النعت بيوصف، البدل بيساوي."}]}],"tricks":[{"n":"١","title":"سؤال الوصف","text":"امسك الاسم اللي قبل الوصف واسأل «إيه صفته؟». اللي يجاوب هو النعت. لو الكلمة مش بتصف حاجة (بتحدد الشخص أو الجزء) يبقى على طول فكر في البدل."},{"n":"٢","title":"طابق الحالة مش الحركة","text":"حدد إعراب المنعوت الأول، والنعت المفرد زيه في الرفع/النصب/الجر. بس خلي بالك: التطابق في الحالة مش في العلامة، المنعوت ممكن يكون مجرور بالفتحة (ممنوع من الصرف) والنعت مجرور بالكسرة. ده فخ الاختيارات الأشهر."},{"n":"٣","title":"«بعد النكرات صفات، وبعد المعارف أحوال»","text":"قاعدة ترجيح سريعة: الجملة أو شبه الجملة بعد اسم نكرة غالبًا نعت، وبعد معرفة غالبًا حال أو متعلق بالفعل. بس مش قانون مطلق: لازم تراجع المعنى وتتأكد إن الكلام فعلًا بيوصف الاسم مش بيحكي عن ظرف الفعل."},{"n":"٤","title":"دور على الرابط","text":"نعت الجملة لازم فيه ضمير بيعود على المنعوت ويطابقه في النوع والعدد. الضمير ممكن يكون مستتر («كتابًا يشرح» = يشرح هو)، أو متصل في أي موقع: فاعل («تحكمه»)، مفعول («ينصفه القاضي»)، أو مضاف إليه («قوانينه عادلة»). مفيش رابط؟ يبقى الجملة مش نعت، راجع حساباتك."},{"n":"٥","title":"الجملة مبتتعربش بحركة","text":"متقولش \"الجملة مرفوعة بالضمة\". الصواب: «الجملة في محل رفع/نصب/جر نعت»، وبعدها تعرب كلمات الجملة جواها كل واحدة بموقعها عادي."},{"n":"٦","title":"النعت ممكن يتباعد","text":"النعت مش لازم يلزق في منعوته؛ ممكن يفصل بينهم مضاف إليه أو نعت تاني: «أعجبتني قصيدةُ الشاعرِ الجميلةُ»، الجميلة نعت لقصيدة (مرفوعة زيها) مش للشاعر، والضبط هو اللي بيحدد الموصوف."},{"n":"٧","title":"فخ \"نكرة + نكرة\"","text":"مجيء نكرة بعد معرفة أو نكرة بعد نكرة مش كفاية لوحده عشان تحكم بنعت، لازم دلالة الوصف: «اشتريت خاتمَ فضةٍ» فضة مضاف إليه مش نعت، و«زار القاهرةَ عاصمةَ مصرَ» عاصمة بدل مش نعت. اسأل: بتوصف ولا بتحدد المقصود؟"},{"n":"٨","title":"جمع غير العاقل","text":"وصف جمع غير العاقل (مساجد، قصص) بالمفرد المؤنث صحيح ووارد: «مساجدَ قديمةٌ». متستغربش ومتعدلش على الآخر من غير ما تراجع."}],"reviewPoints":["النعت تابع يصف ما قبله، والموصوف اسمه المنعوت.","النعت المفرد يطابق المنعوت في: الإعراب + التذكير/التأنيث + التعريف/التنكير + العدد (في الحالة مش في العلامة!).","نعت الجملة (فعلية أو اسمية): لازم ضمير رابط يعود على المنعوت ويطابقه في النوع والعدد، والرابط مش شرط يكون فاعل.","شبه الجملة نعت: متعلقة بمحذوف تقديره \"كائن\" يصف الاسم، وتعرب «في محل ... نعت».","الجملة تعرب «في محل» وكلماتها تعرب داخليًا، مفيش جملة \"مرفوعة بالضمة\".","البدل مقصود بالحكم ويوضح المبدل منه: مطابق (بدون ضمير)، بعض من كل (بضمير)، اشتمال (بضمير).","التمييز: شيل المبدل منه وحط البدل مكانه، الجملة فضلت بنفس المعنى؟ بدل. المعنى اتغير؟ نعت.","بعد النكرة غالبًا نعت، بعد المعرفة غالبًا حال، وسيلة ترجيح، والمعنى هو الحكم."],"closingNote":"اتبنى على صفحة 120 من كتاب الوحدة الثالثة (هيا نوظف لغتنا الجميلة: اضبط لغتك)، مع أمثلة تدريبية إضافية متدرجة للتثبيت. الأمثلة المكتوب عليها «من الكتاب ص 120» منقولة من المنهج، والباقي تدريب إضافي بنفس مستوى الامتحان. بالتوفيق يا جوكر.","exampleGroups":[{"id":"mufrad","title":"أولًا: النعت المفرد","items":[{"n":"١","level":"سهل","sentence":"حَضَرَ طالبٌ مجتهدٌ.","solution":"مجتهدٌ: نعت مفرد مرفوع وعلامة رفعه الضمة. منعوته «طالب» فاعل مرفوع، والنعت يتبعه في الرفع. الاتنين نكرة، مفرد، مذكر، المطابقة كاملة."},{"n":"٢","level":"سهل+","sentence":"شاهدتُ حديقةً جميلةً.","solution":"جميلةً: نعت مفرد منصوب وعلامة نصبه الفتحة؛ لأن منعوته «حديقةً» مفعول به منصوب. وطابقها في التنكير والإفراد والتأنيث."},{"n":"٣","level":"متوسط","sentence":"سَلّمتُ على الطالبَينِ المجتهدَينِ.","solution":"المجتهدَينِ: نعت مفرد مجرور وعلامة جره الياء لأنه مثنى، ومنعوته «الطالبَينِ» اسم مجرور بـ\"على\" وعلامة جره الياء. انتبه: كلمة النعت هنا مثنى، لكن نوع النعت \"مفرد\" لأنه مش جملة ولا شبه جملة؛ \"مفرد\" هنا وصف لصورة التركيب مش للعدد."},{"n":"٤","level":"صعب","sentence":"كَرّمتُ الطالباتِ المجتهداتِ.","solution":"المجتهداتِ: نعت مفرد منصوب وعلامة نصبه الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم؛ ومنعوته «الطالباتِ» مفعول به منصوب بالكسرة برضه. الفخ: الكسرة هنا علامة نصب مش جر، متتخدعش بالشكل، بص على موقع الكلمة في الجملة."},{"n":"٥","level":"تحدٍّ","sentence":"مررتُ بمساجدَ قديمةٍ جميلةٍ.","solution":"«مساجدَ»: اسم مجرور بالباء وعلامة جره الفتحة لأنه ممنوع من الصرف (صيغة منتهى الجموع، غير مضاف ولا مقترن بأل). قديمةٍ: نعت مفرد مجرور وعلامة جره الكسرة. جميلةٍ: نعت ثانٍ مجرور وعلامة جره الكسرة. المفرد المؤنث مناسب هنا لجمع غير العاقل. لاحظ: الكلمات اتفقت في الجر واختلفت علامات الجر، ودي أصغر وأخطر نقطة في الدرس كله."}]},{"id":"filiyya","title":"ثانيًا: نعت الجملة الفعلية","items":[{"n":"١","level":"سهل","sentence":"جاءَ طفلٌ يبتسمُ.","solution":"جملة «يبتسمُ» الفعلية في محل رفع نعت لـ«طفل» (فاعل مرفوع). فاعل «يبتسم» ضمير مستتر تقديره \"هو\"، وهو الرابط العائد على طفل."},{"n":"٢","level":"سهل+","book":true,"sentence":"نَصَّ الإعلانُ على حقوقٍ تصونُ الكرامةَ.","solution":"جملة «تصونُ الكرامةَ» الفعلية في محل جر نعت لـ«حقوقٍ» (مجرورة بـ\"على\"). فاعل «تصون» ضمير مستتر تقديره \"هي\" يعود على حقوق، ده الرابط المطابق في النوع والعدد (جمع غير عاقل = مؤنث مفرد)."},{"n":"٣","level":"متوسط","sentence":"مررتُ بحديقةٍ تتفتّحُ أزهارُها.","solution":"الجملة الفعلية في محل جر نعت لـ«حديقةٍ». «أزهارُها» فاعل ظاهر مرفوع، والهاء المتصلة به هي الرابط. الفخ: متخترعش فاعلًا مستترًا طالما فيه فاعل ظاهر، الرابط مش لازم يكون هو الفاعل."},{"n":"٤","level":"صعب","sentence":"قرأتُ كتابًا لم يفقدْ قيمتَه.","solution":"جملة «لم يفقدْ قيمتَه» الفعلية في محل نصب نعت لـ«كتابًا». «يفقدْ» فعل مضارع مجزوم بـ\"لم\" وعلامة جزمه السكون، فاعله ضمير مستتر تقديره \"هو\" يعود على الكتاب، والهاء في «قيمته» تعود عليه برضه. الفخ: وجود \"لم\" أو \"ال\" قبل الفعل مبيحولش الجملة لاسمية، طالما البداية فعل تفضل فعلية."},{"n":"٥","level":"تحدٍّ","sentence":"قابلتُ رجلًا ينصفُهُ القاضي.","solution":"جملة «ينصفُهُ القاضي» الفعلية في محل نصب نعت لـ«رجلًا». «القاضي» فاعل مرفوع، والهاء في «ينصفُهُ» مفعول به، وهي الرابط العائد على «رجلًا». الفخ القاتل: الرابط مش دايمًا فاعل الفعل؛ هنا الرجل هو اللي بيتنصف (مفعول)، والقاضي هو اللي بينصف (فاعل). اسأل نفسك: مين الضمير اللي بيرجع على المنعوت؟ مش مين الفاعل."}]},{"id":"ismiyya","title":"ثالثًا: نعت الجملة الاسمية","items":[{"n":"١","level":"سهل","sentence":"هذا طالبٌ أخلاقُهُ كريمةٌ.","solution":"جملة «أخلاقُهُ كريمةٌ» الاسمية في محل رفع نعت لـ«طالب» (خبر \"هذا\" مرفوع). «أخلاقٌ» مبتدأ، والهاء مضاف إليه وهي الرابط، و«كريمةٌ» خبر."},{"n":"٢","level":"سهل+","book":true,"sentence":"يُحِبُّ الفردُ مجتمعًا قوانينُهُ عادلةٌ.","solution":"جملة «قوانينُهُ عادلةٌ» الاسمية في محل نصب نعت لـ«مجتمعًا» (مفعول به). «قوانينٌ» مبتدأ مرفوع، والهاء مضاف إليه وهي الرابط العائد على مجتمع، و«عادلةٌ» خبر مرفوع، جوّا الجملة، حتى لو الجملة كلها في محل نصب."},{"n":"٣","level":"متوسط","sentence":"سمعتُ فتاةً صوتُها هادئٌ.","solution":"الجملة الاسمية في محل نصب نعت لـ«فتاةً». «صوتٌ» مبتدأ، الهاء رابط ومضاف إليه، «هادئٌ» خبر. الفخ: «صوت» مذكر و«هادئ» مذكر، وده طبيعي، لأن المبتدأ والخبر جوا الجملة بيوصفوا \"صوتها\" مش \"فتاة\" نفسها؛ اللي بيطابق فتاة هو الرابط (الهاء المؤنثة) مش كلمات الجملة."},{"n":"٤","level":"صعب","sentence":"تحدّثتُ إلى الطالبَينِ خُطُّهُما جميلٌ.","solution":"الجملة الاسمية في محل جر نعت لـ«الطالبَينِ». «خُطٌّ» مبتدأ، «هما» ضمير في محل جر مضاف إليه وهو الرابط العائد على المثنى، «جميلٌ» خبر. الفخ: متثنيش «جميلٌ»، هو خبر لـ\"خُطٍّ\" (مفرد)، مش نعت مباشر للطالبين."},{"n":"٥","level":"تحدٍّ","sentence":"تحدّثتُ إلى طلابٍ آباؤُهُم يدافعونَ عن الحقِّ.","solution":"جملة «آباؤُهُم يدافعونَ عن الحقِّ» الاسمية في محل جر نعت لـ«طلابٍ». «آباؤُ» مبتدأ مرفوع بالضمة، «هم» مضاف إليه وهو الرابط العائد على طلاب، وجملة «يدافعون عن الحق» الفعلية في محل رفع خبر للمبتدأ. الفخ: الجملة الكبيرة اسمية لأنها بدأت باسم (آباؤهم)، وجود فعل جواها ميخليش النعت فعليًا. بص على أول كلمة في جملة النعت."}]},{"id":"shibh","title":"رابعًا: نعت شبه الجملة","note":"قبل الأمثلة: الأمثلة دي مقصود فيها وصف الاسم نفسه. تغيير السياق ممكن يخلي نفس شبه الجملة متعلقة بالفعل مش نعت، راجع تريك ٣.","items":[{"n":"١","level":"سهل","sentence":"هذا كتابٌ عن الفضاءِ.","solution":"«عن الفضاءِ» جار ومجرور متعلقان بمحذوف نعت لـ«كتابٌ»، شبه الجملة في محل رفع نعت. المقصود وصف موضوع الكتاب مش مكان حاجة حصلت."},{"n":"٢","level":"سهل+","book":true,"sentence":"تسعى الدولُ إلى عدالةٍ فوقَ الشبهاتِ.","solution":"«فوقَ» ظرف مكان مضاف و«الشبهات» مضاف إليه؛ شبه الجملة متعلقة بمحذوف نعت لـ«عدالةٍ»، في محل جر نعت (عدالة مجرورة بـ\"إلى\")."},{"n":"٣","level":"متوسط","sentence":"اشتريتُ قميصًا من القطنِ.","solution":"«من القطنِ» جار ومجرور متعلقان بمحذوف نعت لـ«قميصًا»، شبه الجملة في محل نصب نعت. المقصود وصف خامة القميص."},{"n":"٤","level":"صعب","sentence":"أقمتُ في منزلٍ بجوارِ المدرسةِ، لا في المنزلِ البعيدِ عنها.","solution":"«بجوارِ المدرسةِ» متعلقة بمحذوف نعت لـ«منزلٍ»، شبه الجملة في محل جر نعت، والمقارنة مع «المنزل البعيد» بتأكد إنها بتوصف المنزل. الفخ: «في منزلٍ» نفسها مش نعت، دي متعلقة بالفعل «أقمت» (أقمت فين؟ في منزل). متدخلش كل الجروا والمجرورات في بعض."},{"n":"٥","level":"تحدٍّ","sentence":"ثمنُ قلمٍ من الذهبِ مرتفعٌ.","solution":"«من الذهبِ» متعلقة بمحذوف نعت لـ«قلمٍ»، شبه الجملة في محل جر نعت، لأن «قلمٍ» مضاف إليه مجرور. «ثمنُ» مبتدأ مرفوع و«مرتفعٌ» خبره. الفخ: متتبعش المبتدأ البعيد «ثمن» وتقول في محل رفع، اسأل مين الموصوف فعلًا؟ القلم المصنوع من ذهب، مش الثمن."}]},{"id":"badal","title":"خامسًا: البدل وأنواعه","items":[{"n":"١","level":"سهل","book":true,"sentence":"الفاروقُ عُمَرُ أقامَ العدلَ.","solution":"عُمَرُ: بدل كل من كل (مطابق) من «الفاروق»، مرفوع وعلامة رفعه الضمة. عمر هو عين الفاروق، البدل بيتبع المبدل منه في الإعراب، والمطابق مبيحتاجش ضمير."},{"n":"٢","level":"سهل+","sentence":"أكلتُ الرغيفَ ثلثَهُ.","solution":"ثلثَهُ: بدل بعض من كل من «الرغيف»، منصوب وعلامة نصبه الفتحة، والهاء ضمير متصل في محل جر مضاف إليه عائد على المبدل منه، والضمير هنا شرط، من غيره الجملة باطلة نحويًا كبدل."},{"n":"٣","level":"متوسط","book":true,"sentence":"قرأتُ دستورَ الدولةِ مُعظمَهُ.","solution":"مُعظمَهُ: بدل بعض من كل من «دستورَ»، منصوب بالفتحة، والهاء ضمير عائد على الدستور. لاحظ: «الدولةِ» مضاف إليه فاصل بين البدل والمبدل منه، التباعد مش مشكلة طالما الضمير موجود والمعنى واضح."},{"n":"٤","level":"صعب","book":true,"sentence":"يُعجبُني المجتمعُ عدلُهُ.","solution":"عدلُهُ: بدل اشتمال من «المجتمع»، مرفوع وعلامة رفعه الضمة، والهاء ضمير عائد على المجتمع. الفرق عن بدل البعض: عدل المجتمع مش \"جزء\" منه بالمعنى الحسي، ده محتوى فيه، وده معنى الاشتمال."},{"n":"٥","level":"تحدٍّ","book":true,"sentence":"تكفلُ بلادُنا مصرُ للمواطنِ حقوقَهُ الأساسيةَ.","solution":"مصرُ: بدل كل من كل (مطابق) من «بلادُنا»، مرفوع وعلامة رفعه الضمة، لأن مبدله «بلادنا» فاعل مرفوع لـ«تكفل»، والبدل تابع يتبعه في الإعراب حتى لو الحركة مستغربة على علم. و«الأساسيةَ» نعت منصوب لـ«حقوقَهُ». الفخ المزدوج: (1) البدل المطابق مفيهوش ضمير وده سليم، الضمير شرط في بدل البعض والاشتمال بس. (2) الجملة فيها بدل ونعت جنب بعض، مطلوب منك تفرّق بينهم."}]},{"id":"tamyeez","title":"سادسًا: نعت ولا بدل؟ (تدريب التمييز)","note":"زي تمرين الكتاب: في كل مثال حدد إذا كانت الكلمة نعت ولا بدل، وليه.","items":[{"n":"١","level":"سهل","sentence":"جاءَ المعلمُ الفاضلُ — جاءَ المعلمُ أحمدُ.","solution":"«الفاضلُ» نعت مرفوع (وصف). «أحمدُ» بدل مطابق مرفوع (تحديد المقصود). التجربة الذهبية: شيل «المعلم»، «جاءَ أحمدُ» جملة مفيدة وتقصد نفس الشخص، يبقى بدل. «جاءَ الفاضلُ» غيّرت المعنى وشلت الموصوف، يبقى نعت."},{"n":"٢","level":"سهل+","book":true,"sentence":"يؤكدُ الإعلانُ العالميُّ مبادئَ إنسانيةً عامةً.","solution":"«إنسانيةً» نعت مفرد منصوب لـ«مبادئَ»، و«عامةً» نعت ثانٍ منصوب. مش بدل، لأنها صفات مشتقة بتوصف المبادئ، مش المبادئ نفسها ولا جزء منها."},{"n":"٣","level":"متوسط","sentence":"زارَ أحمدُ القاهرةَ عاصمةَ مصرَ.","solution":"«عاصمةَ» بدل مطابق من «القاهرةَ» منصوب بالفتحة. الفخ: نكرة بعد معرفة وبتطابقها في الإعراب، شكلها نعت! لكن المعنى بيحسم: القاهرة هي العاصمة (الكلمتين بيدلوا على نفس الحاجة)، مش وصف إضافي. النعت بيوصف، البدل بيساوي."},{"n":"٤","level":"صعب","book":true,"sentence":"يجب أن يخضعَ الجميعُ لقوانينَ ...... تحمي الحرياتِ","task":"اختر الضبط الصحيح:","options":["(أ) عادلةٍ: تنوين كسر","(ب) عادلةُ: ضمة","(ج) عادلةً: تنوين فتح","(د) عادلةٌ: تنوين ضم"],"solution":"الصواب (أ) عادلةٍ: نعت مفرد مجرور وعلامة جره الكسرة، لأن منعوته «قوانينَ» اسم مجرور باللام في «يخضع لـ». و«تحمي الحرياتِ» جملة فعلية في محل جر نعت ثانٍ، فاعلها ضمير مستتر تقديره \"هي\" عائد على قوانين. الفخ: الاختيارات الأربعة نفس الكلمة، اللي بيحسم هو إعراب المنعوت مش الكلمة."},{"n":"٥","level":"تحدٍّ","book":true,"sentence":"نَصَّ الإعلانُ العالميُّ على حقوقٍ أساسيةٍ تصونُ كرامةَ كلِّ إنسانٍ مظلومٍ","task":"المطلوب: استخرج كل النعوت ونوع كل واحد.","solution":"(1) «العالميُّ» نعت مفرد مرفوع لـ«الإعلان». (2) «أساسيةٍ» نعت مفرد مجرور لـ«حقوقٍ». (3) جملة «تصونُ كرامةَ ...» الفعلية في محل جر نعت لـ«حقوقٍ»، فاعلها مستتر \"هي\" رابط. (4) «مظلومٍ» نعت مفرد مجرور لـ«إنسانٍ». الجملة الواحدة فيها 4 نعوت من 3 أنواع مختلفة، لو طلعتهم كلهم صح، الدرس ده خالص اتقفل."}]}],"questions":[{"topic":"النعت المفرد","level":"سهل","q":"في جملة «حضر طالبٌ مجتهدٌ»، كلمة «مجتهدٌ» تعرب إيه؟","options":["حال منصوب وعلامة نصبه الفتحة","بدل كل من كل مرفوع","نعت مفرد مرفوع وعلامة رفعه الضمة","مضاف إليه مجرور"],"correct":2,"reason":"«مجتهد» كلمة واحدة بتوصف «طالب»، والنعت المفرد بيطابق منعوته في الإعراب؛ «طالب» فاعل مرفوع، يبقى النعت مرفوع بالضمة زيه."},{"topic":"النعت المفرد","level":"متوسط","q":"النعت المفرد بيطابق المنعوت في إيه؟","options":["في نفس الحركة المكتوبة على آخر الكلمة دايمًا","في الحالة الإعرابية والتذكير والتأنيث والتعريف والتنكير والعدد","في التعريف والتنكير بس","في العدد بس"],"correct":1,"reason":"النعت المفرد بيطابق منعوته في الإعراب (رفع/نصب/جر) + التذكير والتأنيث + التعريف والتنكير + العدد. والمهم: المطابقة في الحالة مش في علامة الإعراب نفسها."},{"topic":"النعت المفرد","level":"صعب","q":"في جملة «مررتُ بمساجدَ قديمةٍ جميلةٍ»، إيه الصواب في إعراب الكلمات الثلاث؟","options":["«قديمة» نعت مجرور بالفتحة زي «مساجد» لأن النعت لازم يطابق حركة منعوته","«قديمة» و«جميلة» حال منصوب لأنهم بيوصفوا","«جميلة» بدل من «قديمة» لأنهم ورا بعض","«مساجدَ» مجرور بالفتحة لأنه ممنوع من الصرف، و«قديمةٍ» نعت مجرور بالكسرة، و«جميلةٍ» نعت ثانٍ مجرور بالكسرة"],"correct":3,"reason":"«مساجد» مجرور بالباء وعلامة جره الفتحة لأنه ممنوع من الصرف. النعت بيتبعه في الجر مش في علامة الجر، فالكسرة صح. والمفرد المؤنث مناسب لوصف جمع غير العاقل."},{"topic":"النعت المفرد","level":"صعب","q":"في جملة «كرمتُ الطالباتِ المجتهداتِ»، علامة نصب «المجتهداتِ» هي:","options":["الكسرة نيابة عن الفتحة لأنه جمع مؤنث سالم","الفتحة الظاهرة على آخره","الكسرة لأنه مجرور بالإضافة","الياء لأنه جمع"],"correct":0,"reason":"جمع المؤنث السالم بينصب بالكسرة نيابة عن الفتحة، و«الطالبات» المنعوت منصوب بالكسرة برضه. الموقع في الجملة (مفعول به) هو اللي بيحدد إن الكسرة هنا نصب مش جر."},{"topic":"نعت الجملة الفعلية","level":"سهل","q":"في جملة «جاء طفلٌ يبتسمُ»، جملة «يبتسم» تعرب إيه؟","options":["جملة فعلية في محل نصب حال","جملة فعلية لا محل لها من الإعراب","جملة فعلية في محل رفع نعت لـ«طفل»","جملة فعلية في محل رفع خبر"],"correct":2,"reason":"الجملة بتوصف «طفل»، وفاعل «يبتسم» ضمير مستتر تقديره «هو» راجع على طفل، وده الرابط المطلوب في نعت الجملة. «طفل» فاعل مرفوع، يبقى الجملة في محل رفع نعت."},{"topic":"نعت الجملة الفعلية","level":"متوسط","q":"في جملة «نصَّ الإعلانُ على حقوقٍ تصونُ الكرامةَ»، الرابط في جملة النعت هو:","options":["الواو في «تصون» راجعة على «حقوق» باعتبارها جمع مذكر","مفيش رابط لأن الجملة فعلية","ضمير مستتر تقديره «هم» لأن «حقوق» جمع","ضمير مستتر تقديره «هي» فاعل «تصون»، عائد على «حقوق»"],"correct":3,"reason":"فاعل «تصون» ضمير مستتر تقديره «هي» بيعود على «حقوق»، والرابط بيطابق المنعوت في النوع والعدد: جمع غير العاقل بيعامل معاملة المفرد المؤنث."},{"topic":"نعت الجملة الفعلية","level":"صعب","q":"في جملة «قابلتُ رجالًا ينصفُهم القاضي»، مين الرابط العائد على «رجالًا» وإيه موقعه؟","options":["«القاضي»، وهو فاعل مرفوع","الضمير المتصل «هم» في «ينصفُهم»، وهو في محل نصب مفعول به","مفيش رابط صريح في الجملة","ضمير مستتر تقديره «هم»، وهو فاعل «ينصف»"],"correct":1,"reason":"«القاضي» هو الفاعل (اللي بينصف)، والضمير المتصل «هم» في «ينصفهم» مفعول به وهو اللي بيرجع على «رجالًا». الرابط مش شرط يكون فاعل: ممكن يكون مفعول أو مضاف إليه."},{"topic":"نعت الجملة الفعلية","level":"متوسط","q":"في جملة «قرأتُ كتابًا لم يفقدْ قيمتَهُ»، جملة «لم يفقدْ قيمته»:","options":["جملة فعلية في محل نصب نعت لـ«كتابًا»","جملة اسمية في محل نصب نعت لأنها بدأت بـ«لم»","جملة فعلية لا محل لها لأن الفعل مجزوم","جملة فعلية في محل رفع نعت"],"correct":0,"reason":"وجود «لم» قبل الفعل مبيحولش الجملة لاسمية؛ طالما البداية فعل تفضل فعلية. «كتابًا» مفعول به منصوب، يبقى الجملة في محل نصب نعت. والهاء في «قيمته» رابط تاني عائد على الكتاب."},{"topic":"نعت الجملة الاسمية","level":"سهل","q":"في جملة «هذا طالبٌ أخلاقُهُ كريمةٌ»، جملة «أخلاقه كريمة» تعرب إيه؟","options":["جملة اسمية في محل رفع خبر «هذا»","جملة اسمية لا محل لها من الإعراب","«كريمة» نعت مفرد لـ«طالب» ومفيش جملة أصلًا","جملة اسمية في محل رفع نعت لـ«طالبٌ»"],"correct":3,"reason":"الجملة بدأت باسم («أخلاق» مبتدأ) يبقى اسمية، وفيها الهاء مضاف إليه وهي الرابط العائد على «طالب». «طالب» خبر «هذا» مرفوع، يبقى الجملة في محل رفع نعت."},{"topic":"نعت الجملة الاسمية","level":"متوسط","q":"في جملة «سمعتُ فتاةً صوتُها هادئٌ»، إعراب «هادئٌ» هو:","options":["نعت منصوب لـ«فتاةً»","حال منصوب","خبر مرفوع وعلامة رفعه الضمة","مبتدأ مرفوع"],"correct":2,"reason":"«هادئ» خبر للمبتدأ «صوت» جوا جملة النعت، ومرفوع حتى لو الجملة كلها في محل نصب. الجملة تعرب «في محل» وكلماتها تتعرب داخليًا. «هادئ» مذكر لأنه بيوصف «صوتها» مش «فتاة»؛ اللي بيطابق فتاة هو الرابط (الهاء المؤنثة)."},{"topic":"نعت الجملة الاسمية","level":"صعب","q":"في جملة «تحدثتُ إلى طلابٍ آباؤُهم يدافعونَ عن الحقِّ»، جملة النعت نوعها إيه وليه؟","options":["جملة فعلية في محل جر نعت، لأن فيها الفعل «يدافعون»","جملة اسمية في محل جر نعت، لأنها بدأت باسم («آباؤهم»)","جملة اسمية لا محل لها من الإعراب","جملة فعلية في محل رفع نعت"],"correct":1,"reason":"بص على أول كلمة في جملة النعت: «آباؤهم» اسم (مبتدأ مرفوع بالضمة)، يبقى الجملة الكبيرة اسمية، و«هم» مضاف إليه وهو الرابط. وجملة «يدافعون عن الحق» الفعلية جواها في محل رفع خبر للمبتدأ. وجود فعل جوا الجملة ميخليش النعت فعليًا."},{"topic":"نعت شبه الجملة","level":"سهل","q":"في جملة «هذا كتابٌ عن الفضاءِ»، شبه الجملة «عن الفضاء» تعرب إيه؟","options":["جار ومجرور متعلقان بمحذوف في محل رفع نعت لـ«كتابٌ»","جار ومجرور متعلقان بالفعل","حال منصوب","مضاف إليه مجرور"],"correct":0,"reason":"«عن الفضاء» بتوصف موضوع الكتاب نفسه، فهي متعلقة بمحذوف تقديره «كائن» بيوصف الاسم، وتعرب «في محل رفع نعت» لأن «كتاب» خبر «هذا» مرفوع. ومش بنطلب ضمير ظاهر جوا شبه الجملة."},{"topic":"نعت شبه الجملة","level":"صعب","q":"في جملة «أقمتُ في منزلٍ بجوارِ المدرسةِ»، إعراب «بجوار المدرسة» هو:","options":["شبه جملة متعلقة بالفعل «أقمت»","«جوار» مضاف إليه مجرور","شبه جملة في محل رفع نعت","شبه جملة في محل جر نعت لـ«منزلٍ»"],"correct":3,"reason":"«بجوار المدرسة» بتوصف المنزل (منزل إيه؟ اللي جنب المدرسة)، فهي متعلقة بمحذوف نعت لـ«منزلٍ» المجرور. أما «في منزل» نفسها فمتعلقة بالفعل «أقمت» (أقمت فين؟ في منزل) ومش نعت. متدخلش كل الجروا والمجرورات في بعض."},{"topic":"نعت شبه الجملة","level":"صعب","q":"في جملة «ثمنُ قلمٍ من الذهبِ مرتفعٌ»، شبه الجملة «من الذهب» في محل:","options":["رفع نعت لـ«ثمنُ»","رفع خبر للمبتدأ «ثمن»","جر نعت لـ«قلمٍ»","نصب حال"],"correct":2,"reason":"اسأل مين الموصوف فعلًا؟ القلم المصنوع من ذهب، مش الثمن. «قلم» مضاف إليه مجرور، يبقى شبه الجملة في محل جر نعت. «ثمن» مبتدأ مرفوع و«مرتفع» خبره."},{"topic":"البدل","level":"متوسط","q":"في جملة «قرأتُ دستورَ الدولةِ معظمَهُ»، كلمة «معظمَهُ» تعرب إيه؟","options":["نعت مفرد منصوب لـ«دستور»","بدل بعض من كل من «دستورَ»، منصوب بالفتحة","بدل كل من كل من «الدولةِ»","مفعول به ثانٍ منصوب"],"correct":1,"reason":"المعظم جزء من الدستور، يبقى بدل بعض من كل، بيتبع المبدل منه في الإعراب (منصوب). والهاء ضمير عائد على الدستور، والضمير مطلوب في بدل البعض من كل. «الدولة» مضاف إليه فاصل بين البدل والمبدل منه وده وارد."},{"topic":"البدل","level":"صعب","q":"في جملة «تكفلُ بلادُنا مصرُ للمواطنِ حقوقَهُ الأساسيةَ»، كلمة «مصرُ» بدل كل من كل من «بلادنا» ومفيهاش ضمير. ده صحيح ليه؟","options":["البدل المطابق لا يحتاج ضميرًا؛ الضمير مطلوب في بدل البعض من كل وبدل الاشتمال","كل أنواع البدل لازم يتصل بيها ضمير عائد على المبدل منه","الضمير ممنوع في كل أنواع البدل","الأعلام زي «مصر» مبتاخدش بدل أصلًا"],"correct":0,"reason":"البدل المطابق هو عين المبدل منه، فمش محتاج ضمير يربطه بيه؛ الضمير مطلوب في بدل البعض وبدل الاشتمال بس. والبدل بيتبع المبدل منه: «بلادُنا» فاعل مرفوع، فـ«مصرُ» مرفوعة بالضمة زيها."},{"topic":"نعت ولا بدل؟","level":"متوسط","q":"في جملة «الفاروقُ عمرُ أقامَ العدلَ»، كلمة «عمرُ» تعرب إيه؟","options":["نعت مفرد مرفوع لـ«الفاروق»","مبتدأ مرفوع و«الفاروق» خبره","حال منصوب","بدل كل من كل من «الفاروقُ» مرفوع بالضمة"],"correct":3,"reason":"«عمر» هو عين «الفاروق»، اللقب والاسم بيدلوا على نفس الشخص، فده تحديد للمقصود مش وصف. «الفاروق» مبتدأ مرفوع، يبقى «عمر» بدل مطابق مرفوع، والمطابق مش محتاج ضمير. التجربة الذهبية: «عمرُ أقامَ العدلَ» جملة مفيدة بنفس المعنى، يبقى بدل."},{"topic":"نعت ولا بدل؟","level":"صعب","q":"«يجب أن يخضعَ الجميعُ لقوانينَ ...... تحمي الحرياتِ»، اختر الضبط الصحيح للفراغ:","options":["عادلةً (تنوين فتح)","عادلةٌ (تنوين ضم)","عادلةٍ (تنوين كسر)","عادلةُ (ضمة)"],"correct":2,"reason":"«عادلة» نعت مفرد مجرور بالكسرة لأن منعوتها «قوانينَ» اسم مجرور باللام في «يخضع لـ». وجملة «تحمي الحريات» الفعلية في محل جر نعت ثانٍ، فاعلها ضمير مستتر «هي» عائد على قوانين. اللي بيحسم هو إعراب المنعوت مش شكل الكلمة."}]};</script>
